<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#160d0b" />
<title>Rivela Bakery — Cheesecake 3D</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #160d0b;
  }

  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none;
    touch-action: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .brand-logo {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    left: max(26px, env(safe-area-inset-left));
    z-index: 6;
    width: clamp(128px, 12vw, 172px);
    height: auto;
    pointer-events: none;
    user-select: none;
    opacity: .98;
    filter: drop-shadow(0 7px 18px rgba(0,0,0,.22));
  }

  .loading,
  .fallback {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: #160d0b;
    color: rgba(255,242,232,.86);
    transition: opacity .35s ease, visibility .35s ease;
  }

  .loading.hide {
    opacity: 0;
    visibility: hidden;
  }

  .loader {
    width: 38px;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid rgba(255,237,224,.12);
    border-top-color: rgba(255,213,179,.82);
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .fallback {
    display: none;
    padding: 28px;
    text-align: center;
    line-height: 1.45;
    font-size: 14px;
  }

  .fallback.show { display: grid; }

  /* Evita una capa animada costosa en móviles Android. */
  @media (min-width: 900px) and (prefers-reduced-motion: no-preference) {
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(circle at 52% 44%,
          rgba(0,0,0,0) 34%,
          rgba(10,4,3,.07) 64%,
          rgba(5,2,2,.38) 100%);
      mix-blend-mode: multiply;
    }
  }

  @media (max-width: 720px) {
    .brand-logo {
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      width: 128px;
    }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<img class="brand-logo" src="./rivela-logo.svg" alt="Rivela Bakery" />

<div class="loading" id="loading">
  <div class="loader" aria-label="Cargando"></div>
</div>

<div class="fallback" id="fallback">
  <div>
    No fue posible iniciar la vista 3D en este dispositivo.<br>
    Recarga la página o prueba con Chrome actualizado.
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";

// ============================================================
// PERFIL DE RENDIMIENTO ADAPTATIVO
// ============================================================
const coarsePointer = matchMedia("(pointer: coarse)").matches;
const isAndroid = /Android/i.test(navigator.userAgent);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

const memoryGB = navigator.deviceMemory || 8;
const cores = navigator.hardwareConcurrency || 8;

const lowEnd =
  memoryGB <= 4 ||
  cores <= 4 ||
  (isAndroid && memoryGB <= 6);

const mobile = coarsePointer || isAndroid || isIOS;

const QUALITY = {
  dpr: lowEnd ? 1.0 : mobile ? 1.25 : 1.75,
  antialias: !lowEnd,
  shadow: lowEnd ? 512 : mobile ? 1024 : 2048,
  woodW: lowEnd ? 512 : mobile ? 768 : 1024,
  woodH: lowEnd ? 384 : mobile ? 512 : 768,
  useEnvironment: true,
  useAreaLights: true
};

// ============================================================
// WEBGL CHECK
// ============================================================
const fallback = document.getElementById("fallback");

function webglAvailable() {
  try {
    const c = document.createElement("canvas");
    return !!(
      window.WebGLRenderingContext &&
      (c.getContext("webgl2") || c.getContext("webgl"))
    );
  } catch {
    return false;
  }
}

if (!webglAvailable()) {
  document.getElementById("loading").classList.add("hide");
  fallback.classList.add("show");
  throw new Error("WebGL no disponible.");
}

// ============================================================
// RENDERER
// ============================================================
const renderer = new THREE.WebGLRenderer({
  antialias: QUALITY.antialias,
  alpha: false,
  powerPreference: "high-performance",
  preserveDrawingBuffer: false
});

renderer.setPixelRatio(Math.min(devicePixelRatio || 1, QUALITY.dpr));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

document.body.appendChild(renderer.domElement);

// Context loss: evita quedarse con un canvas blanco sin explicación.
let lostOnce = false;

renderer.domElement.addEventListener("webglcontextlost", (event) => {
  event.preventDefault();

  if (!lostOnce) {
    lostOnce = true;
    document.getElementById("loading").classList.remove("hide");
    setTimeout(() => location.reload(), 700);
  } else {
    fallback.classList.add("show");
  }
}, false);

// ============================================================
// ESCENA
// ============================================================
const BG = 0x160d0b;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

// Fog lineal es más predecible y barato que una combinación
// de shaders personalizados + grandes geometrías.
scene.fog = new THREE.Fog(BG, 7.5, 17.5);

const camera = new THREE.PerspectiveCamera(
  mobile ? 37 : 35,
  innerWidth / innerHeight,
  0.03,
  60
);

camera.position.set(4.7, 2.9, 5.9);

// ============================================================
// CONTROLES
// ============================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.50;
controls.minPolarAngle = THREE.MathUtils.degToRad(52);
controls.maxPolarAngle = THREE.MathUtils.degToRad(78);

// ============================================================
// ENVIRONMENT: SOLO CUANDO LA GPU TIENE MARGEN
// ============================================================
if (QUALITY.useEnvironment) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new RoomEnvironment();

  scene.environment = pmrem.fromScene(room, 0.025).texture;
  scene.environmentIntensity = 0.28;

  room.dispose();
  pmrem.dispose();
}

// ============================================================
// TEXTURA DE MADERA MÁS LIGERA
// ============================================================
function seeded(seed = 7319) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function makeWoodTexture(seed, width, height) {
  const rand = seeded(seed);
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d", { alpha: false });

  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, "#3a2118");
  grad.addColorStop(.52, "#1d0f0b");
  grad.addColorStop(1, "#2f190f");

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  const lines = lowEnd ? 125 : mobile ? 185 : 260;

  for (let i = 0; i < lines; i++) {
    const y = rand() * height;
    const amp = 1.5 + rand() * (height * .012);
    const freq = .004 + rand() * .009;
    const phase = rand() * Math.PI * 2;
    const alpha = .018 + rand() * .080;

    ctx.beginPath();

    for (let x = 0; x <= width; x += 10) {
      const wobble =
        Math.sin(x * freq + phase) * amp +
        Math.sin(x * freq * .35 + phase * 1.7) * amp * .34;

      if (x === 0) ctx.moveTo(x, y + wobble);
      else ctx.lineTo(x, y + wobble);
    }

    ctx.lineWidth = .4 + rand() * 1.5;
    ctx.strokeStyle = rand() > .60
      ? `rgba(255,164,100,${alpha * .38})`
      : `rgba(4,1,0,${alpha})`;

    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3.0, 2.25);
  texture.rotation = -0.05;
  texture.center.set(.5, .5);
  texture.anisotropy = Math.min(
    renderer.capabilities.getMaxAnisotropy(),
    mobile ? 4 : 8
  );

  return texture;
}

function makeFadeTexture(size = 512) {
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");
  const g = ctx.createRadialGradient(
    size/2, size/2, size*.16,
    size/2, size/2, size*.50
  );

  g.addColorStop(0, "#ffffff");
  g.addColorStop(.38, "#ffffff");
  g.addColorStop(.72, "#a0a0a0");
  g.addColorStop(.91, "#262626");
  g.addColorStop(1, "#000000");

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  return new THREE.CanvasTexture(canvas);
}

const woodTexture = makeWoodTexture(
  8127,
  QUALITY.woodW,
  QUALITY.woodH
);

const fadeTexture = makeFadeTexture(lowEnd ? 256 : 512);

const floorMaterial = new THREE.MeshStandardMaterial({
  map: woodTexture,
  bumpMap: lowEnd ? null : woodTexture,
  bumpScale: lowEnd ? 0 : .035,
  alphaMap: fadeTexture,
  transparent: true,
  opacity: 1,
  roughness: .59,
  metalness: 0,
  depthWrite: true
});

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  floorMaterial
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

// ============================================================
// ILUMINACIÓN
// ============================================================
scene.add(
  new THREE.HemisphereLight(
    0xffd6ba,
    0x120708,
    0.28
  )
);

// Principal: sombra cálida y editorial.
const sun = new THREE.DirectionalLight(
  0xffb56f,
  4.25
);

sun.position.set(6.7, 8.8, 4.0);
sun.castShadow = true;
sun.shadow.mapSize.set(QUALITY.shadow, QUALITY.shadow);
sun.shadow.camera.near = .1;
sun.shadow.camera.far = 22;
sun.shadow.camera.left = -5;
sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5;
sun.shadow.camera.bottom = -5;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = .018;
sun.shadow.radius = lowEnd ? 1 : 1.45;
scene.add(sun);

// Rebote cálido.
const bounce = new THREE.PointLight(
  0xb94d2e,
  7.0,
  8.5,
  2
);
bounce.position.set(2.6, .85, 1.25);
scene.add(bounce);

// Rim posterior.
const rim = new THREE.PointLight(
  0xffc6aa,
  5.2,
  7.0,
  2
);
rim.position.set(-1.8, 3.5, -3.0);
scene.add(rim);

// Misma iluminación en escritorio, iOS y Android.
// Las optimizaciones móviles afectan resolución/sombras, no el color de la escena.
RectAreaLightUniformsLib.init();

const warmSoft = new THREE.RectAreaLight(
  0xff9f68,
  13.5,
  4.4,
  3.0
);
warmSoft.position.set(4.6, 5.4, 3.6);
warmSoft.lookAt(0, .75, 0);
scene.add(warmSoft);

const coolFill = new THREE.RectAreaLight(
  0x9f7896,
  3.4,
  4.0,
  3.0
);
coolFill.position.set(-4.4, 3.2, 2.1);
coolFill.lookAt(0, .7, 0);
scene.add(coolFill);

// ============================================================
// SOMBRAS DIAGONALES
// ============================================================
const blockerMaterial = new THREE.MeshBasicMaterial({
  color: 0x000000,
  colorWrite: false,
  depthWrite: false
});

function addBlocker(w, h, x, y, z, rz, ry = 0) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    blockerMaterial
  );

  mesh.position.set(x, y, z);
  mesh.rotation.set(0, ry, rz);
  mesh.castShadow = true;
  scene.add(mesh);
}

addBlocker(1.05, 7, 3.45, 4.8, 1.95, -.53, -.22);
addBlocker(.62, 7, 4.55, 4.7, 2.22, -.53, -.22);

// ============================================================
// CARGA DIRECTA DEL GLB
// Sin Base64: reduce el pico de memoria en Android.
// ============================================================
const loader = new GLTFLoader();

loader.load(
  "./cheesecake.glb",

  (gltf) => {
    const model = gltf.scene;
    scene.add(model);

    model.traverse((obj) => {
      if (!obj.isMesh) return;

      obj.castShadow = true;
      obj.receiveShadow = true;

      const materials = Array.isArray(obj.material)
        ? obj.material
        : [obj.material];

      for (const mat of materials) {
        if (!mat) continue;

        if (mat.map) {
          mat.map.colorSpace = THREE.SRGBColorSpace;
          mat.map.anisotropy = Math.min(
            renderer.capabilities.getMaxAnisotropy(),
            mobile ? 4 : 8
          );
        }

        if ("envMapIntensity" in mat) {
          mat.envMapIntensity = .58;
        }

        mat.needsUpdate = true;
      }
    });

    // -----------------------------
    // CENTRADO Y ESCALA AUTOMÁTICOS
    // -----------------------------
    model.updateMatrixWorld(true);

    let box = new THREE.Box3().setFromObject(model);
    let size = box.getSize(new THREE.Vector3());
    let center = box.getCenter(new THREE.Vector3());

    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= box.min.y;
    model.updateMatrixWorld(true);

    box = new THREE.Box3().setFromObject(model);
    size = box.getSize(new THREE.Vector3());

    const footprint = Math.max(size.x, size.z);
    const targetWidth = mobile ? 3.48 : 3.70;
    model.scale.multiplyScalar(targetWidth / footprint);
    model.updateMatrixWorld(true);

    box = new THREE.Box3().setFromObject(model);
    model.position.y -= box.min.y;
    model.updateMatrixWorld(true);

    box = new THREE.Box3().setFromObject(model);
    size = box.getSize(new THREE.Vector3());
    center = box.getCenter(new THREE.Vector3());

    model.position.x -= .08;
    model.position.z += .08;
    model.updateMatrixWorld(true);

    box = new THREE.Box3().setFromObject(model);
    size = box.getSize(new THREE.Vector3());
    center = box.getCenter(new THREE.Vector3());

    const target = new THREE.Vector3(
      center.x,
      box.min.y + size.y * .49,
      center.z
    );

    controls.target.copy(target);

    const radius = Math.max(size.x, size.z);
    const d = radius * (mobile ? 2.08 : 1.95);

    camera.position.set(
      target.x + d * .88,
      box.min.y + Math.max(
        size.y * (mobile ? 2.30 : 2.18),
        radius * .69
      ),
      target.z + d
    );

    controls.minDistance = Math.max(radius * 1.28, 2.6);
    controls.maxDistance = Math.max(radius * 3.9, 7.5);

    sun.target.position.copy(target);
    scene.add(sun.target);

    controls.update();

    document.getElementById("loading").classList.add("hide");
  },

  undefined,

  (error) => {
    console.error("Error al cargar GLB:", error);
    document.getElementById("loading").classList.add("hide");
    fallback.classList.add("show");
  }
);

// ============================================================
// LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

// ============================================================
// RESIZE
// ============================================================
let resizeRAF = 0;

addEventListener("resize", () => {
  cancelAnimationFrame(resizeRAF);

  resizeRAF = requestAnimationFrame(() => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(
      Math.min(devicePixelRatio || 1, QUALITY.dpr)
    );

    renderer.setSize(innerWidth, innerHeight, false);
  });
}, { passive: true });

</script>
</body>
</html>
